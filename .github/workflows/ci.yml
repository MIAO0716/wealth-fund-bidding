name: 持续验证

# 每次推送与 PR：类型检查、构建、规则/服务端集成/前端单元测试、浏览器端到端测试
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bid
          POSTGRES_PASSWORD: bid
          POSTGRES_DB: bidding_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bid" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 仅指向本作业内的临时数据库；测试会清空这些库
      TEST_DATABASE_URL: postgres://bid:bid@localhost:5432/bidding_test
      E2E_DATABASE_URL: postgres://bid:bid@localhost:5432/bidding_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 规则、服务端集成与前端单元测试
        run: npm test

      - name: 准备端到端测试
        run: |
          PGPASSWORD=bid psql -h localhost -U bid -d bidding_test -c 'CREATE DATABASE bidding_e2e'
          npx playwright install --with-deps chromium

      - name: 浏览器端到端测试
        run: npm run test:e2e

      - name: 保存失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
