# 用法：
#   cp .env.example .env    # 至少设置 DB_PASSWORD、PUBLIC_BASE_URL
#   docker compose up -d --build
#   docker compose run --rm app node apps/server/dist/admin-create.js --username admin --name 工作人员
services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: bid
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: bidding
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bid -d bidding']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bid:${DB_PASSWORD}@db:5432/bidding
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请在 .env 中设置 PUBLIC_BASE_URL（手机可访问的地址）}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      READ_ONLY: ${READ_ONLY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      - ./backups:/backups
    restart: unless-stopped

volumes:
  pgdata:
