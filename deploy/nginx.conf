# 互联网 HTTPS 部署的 Nginx 反向代理示例（应用以 TRUST_PROXY=true 运行在 127.0.0.1:8080）
server {
    listen 443 ssl http2;
    server_name bid.example.com;

    ssl_certificate     /etc/ssl/bid.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/bid.example.com/privkey.pem;

    client_max_body_size 4m;

    # 实时推送（SSE）：必须关闭缓冲，放宽读超时
    location ~ ^/api/v1/.*/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name bid.example.com;
    return 301 https://$host$request_uri;
}
